[project]
name = "mithril"
version = "0.1.0"
description = "Mithril — a trust and governance layer for Cognee memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cognee>=1.2.2",
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
